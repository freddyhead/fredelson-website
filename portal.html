<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investor Portal — Fredelson Investments</title>
  <meta name="description" content="Investor portal sign in for Fredelson Investments." />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-top: 64px;
    }
    .logo-link {
      display: inline-block;
      line-height: 0;
    }
    .card {
      margin-top: 112px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #e5e5e5;
      padding: 24px;
    }
    form { display: flex; flex-direction: column; gap: 16px; }
    input {
      width: 100%;
      border: 1px solid #cccccc;
      padding: 14px 16px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #00a2ff; }
    button {
      width: 100%;
      background: #4caf50;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #43a047; }
    .error {
      font-size: 14px;
      color: #d32f2f;
      margin: 0;
    }
  </style>
</head>
<body>
  <a href="index.html" class="logo-link" aria-label="Back to home">
    <svg width="96" height="105" viewBox="0 0 228 249" role="img" aria-label="Fredelson Investments" xmlns="http://www.w3.org/2000/svg">
      <rect width="66" height="249" fill="#00A2FF" />
      <rect x="81" width="66" height="66" fill="#00A2FF" />
      <rect x="81" y="79" width="66" height="66" fill="#00A2FF" />
      <rect x="162" width="66" height="66" fill="#00A2FF" />
      <rect x="162" y="79" width="66" height="170" fill="#00A2FF" />
    </svg>
  </a>
  <div class="card">
    <form id="login-form">
      <input type="text" name="uname" placeholder="Enter Username" required autocomplete="username" />
      <input type="password" name="psw" placeholder="Enter Password" required autocomplete="current-password" />
      <p id="error" class="error" style="display:none" role="alert">Incorrect password, please try again.</p>
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('error').style.display = 'block';
    });
  </script>
</body>
</html>
